
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Serve STEM simulation files directly
    location ^~ /Labs/ {
        try_files $uri $uri/ =404;
    }

    # Serve static assets
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|mp4|webm|mp3|wav|pdf|json|xml)$ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # React client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
