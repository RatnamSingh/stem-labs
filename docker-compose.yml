services:
  labs-frontend:
    image: ${GHCR_IMAGE:?GHCR_IMAGE must be set}
    container_name: labs-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8302:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
