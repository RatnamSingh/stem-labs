name: Labs CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: labs-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy Compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker.compose.yml
          target: /root/labs/
          overwrite: true
          strip_components: 0

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd /root/labs

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            export GHCR_IMAGE

            docker compose -f docker.compose.yml config -q
            docker compose -f docker.compose.yml pull
            docker compose -f docker.compose.yml up -d --remove-orphans

            for i in $(seq 1 30); do
              if [ "$(docker inspect --format='{{.State.Health.Status}}' labs-frontend 2>/dev/null || true)" = "healthy" ]; then
                echo "Labs deployment is healthy."
                exit 0
              fi
              sleep 2
            done

            docker compose -f docker.compose.yml ps
            docker logs --tail 100 labs-frontend
            exit 1
